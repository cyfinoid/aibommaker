<script>
"use strict";
const out = [];
let passed = 0, failed = 0;
function assert(cond, msg) {
  if (cond) { passed++; out.push(`<div class="case pass">✓ ${msg}</div>`); }
  else { failed++; out.push(`<div class="case fail">✗ FAIL: ${msg}</div>`); }
}
function section(name) { out.push(`<h2>${name}</h2>`); }

section("isPlausibleModelId — extracted-value validation");
assert(isPlausibleModelId("gpt-4o-mini") === true, "accepts gpt-4o-mini");
assert(isPlausibleModelId("claude-sonnet-4-5") === true, "accepts claude-sonnet-4-5");
assert(isPlausibleModelId("meta-llama/Llama-2-7b-chat-hf") === true, "accepts HF slug");
assert(isPlausibleModelId("qwen3:4b") === true, "accepts Ollama tag");
assert(isPlausibleModelId("gemini-2.5-pro") === true, "accepts gemini-2.5-pro");
assert(isPlausibleModelId("192.168.1.1") === false, "rejects IP address");
assert(isPlausibleModelId("1.2.3") === false, "rejects bare version");
assert(isPlausibleModelId("latest") === false, "rejects 'latest'");
assert(isPlausibleModelId("https://api.openai.com") === false, "rejects URL");
assert(isPlausibleModelId("pytest") === false, "rejects non-model value (misleading_config bait)");
assert(isPlausibleModelId("12345") === false, "rejects pure number");
assert(isPlausibleModelId("logo.png") === false, "rejects file extension");
assert(isPlausibleModelId("{{model_name}}") === false, "rejects template placeholder");
assert(isPlausibleModelId("ab") === false, "rejects too-short string");

section("stripNotebookCells — .ipynb source extraction");
const nb = JSON.stringify({ cells: [
  { cell_type: "code", source: ["import openai as oa\n", "client = oa.OpenAI()"] },
  { cell_type: "markdown", source: ["# notes"] },
  { cell_type: "code", source: "model = \"gpt-4o\"" }
]});
const stripped = stripNotebookCells(nb);
assert(stripped.includes("client = oa.OpenAI()"), "array-source cells joined");
assert(stripped.includes("model = \"gpt-4o\""), "string-source cells joined");
assert(stripNotebookCells("not json") === "", "invalid JSON -> empty string");
assert(stripNotebookCells(JSON.stringify({ foo: 1 })) === "", "object without cells -> empty string");
assert(stripNotebookCells(null) === "", "null -> empty string");

section("extractContextualModelRefs — kwarg/constant/env-default extraction");
{
  // akumar0205 adversarial/env_driven.py scenario
  const py1 = 'import os\nfrom langchain_openai import ChatOpenAI\nSELECTED_MODEL = os.environ.get("APP_MODEL", "gpt-4o-mini")\nllm = ChatOpenAI(model=SELECTED_MODEL)\n';
  const r1 = extractContextualModelRefs(py1);
  assert(r1.some(r => r.model === "gpt-4o-mini" && r.method === "env-default"), "env-default dataflow captured");

  // cisco-style kwarg with constructor attribution
  const py2 = 'from openai import OpenAI\nclient = OpenAI(model="gpt-4o-mini-2024-07-18")\nresp = client.chat.completions.create(model="o4-mini", messages=[])\n';
  const r2 = extractContextualModelRefs(py2);
  assert(r2.some(r => r.model === "gpt-4o-mini-2024-07-18" && r.provider === "OpenAI"), "kwarg with OpenAI ctor attribution");
  assert(r2.some(r => r.model === "o4-mini"), "second kwarg captured");

  // JS wrapper factory (akumar adversarial/wrapper_factory.ts)
  const ts1 = 'import OpenAI from "openai";\nconst MODEL_NAME = process.env.APP_MODEL ?? "gpt-4o-mini";\nconst pinned = new OpenAI({ apiKey: key, model: "gpt-4.1-mini" });\n';
  const r3 = extractContextualModelRefs(ts1);
  assert(r3.some(r => r.model === "gpt-4o-mini" && r.method === "env-default"), "process.env ?? default captured");
  assert(r3.some(r => r.model === "gpt-4.1-mini"), "object-literal kwarg captured");

  // Ternary default
  const ts2 = 'const m = process.env.LLM_MODEL ? process.env.LLM_MODEL : "claude-sonnet-4-5";';
  assert(extractContextualModelRefs(ts2).some(r => r.model === "claude-sonnet-4-5"), "ternary env default captured");

  // Constant assignment + variable resolution
  // (assignment and its kwarg usage dedupe to one entry keyed by first method seen)
  const py3 = 'DEFAULT_MODEL = "deepseek-v3"\nagent = AssistantAgent(name="helper", model=DEFAULT_MODEL)\n';
  const r5 = extractContextualModelRefs(py3);
  assert(r5.some(r => r.model === "deepseek-v3"), "module constant captured");
  assert(r5.some(r => r.method === "constant-DEFAULT_MODEL"), "kwarg variable resolved to constant");
  assert(r5.filter(r => r.model === "deepseek-v3").length === 1, "constant + usage deduplicated to one entry");

  // Azure deployment_name
  const az = 'deployment = AzureOpenAI(azure_endpoint=ep, deployment_name="gpt-35-turbo", api_key=k)';
  assert(extractContextualModelRefs(az).some(r => r.model === "gpt-35-turbo"), "deployment_name kwarg captured");

  // YAML-style config
  const yml = 'provider:\n  model_name: "gemini-2.5-flash"\n  model: "qwen3:32b"\n';
  const ry = extractContextualModelRefs(yml);
  assert(ry.some(r => r.model === "gemini-2.5-flash"), "YAML model_name captured");
  assert(ry.some(r => r.model === "qwen3:32b"), "YAML model with Ollama tag captured");

  // False-positive baits (akumar misleading_config.yaml + junk kwargs)
  const fp = 'model_trainer = "pytest"\nfoo(model="latest")\nbar(model_name="https://api.example.com")\nbaz(model="12345")\n';
  const rf = extractContextualModelRefs(fp);
  assert(!rf.some(r => r.model === "pytest"), "rejects pytest");
  assert(!rf.some(r => r.model === "latest"), "rejects latest");
  assert(!rf.some(r => r.model.includes("https")), "rejects URL value");
  assert(!rf.some(r => r.model === "12345"), "rejects numeric value");

  // Comments skipped
  const cm = '# model = "gpt-4o"\n// const x = "claude-3-opus"\nconst y = "gemini-2.5-pro";\n';
  const rc = extractContextualModelRefs(cm);
  assert(!rc.some(r => r.model === "gpt-4o"), "python comment skipped");
  assert(!rc.some(r => r.model === "claude-3-opus"), "JS comment skipped");
  assert(rc.some(r => r.model === "gemini-2.5-pro"), "live line still captured");

  // No default -> no invented model
  const nd = 'model=os.environ.get("OPENAI_MODEL")\nfoo(model=API_MODEL)';
  assert(extractContextualModelRefs(nd).length === 0, "no default -> nothing invented");

  // Provider filter: attributed refs must match detected providers;
  // unattributed (provider === null) refs are kept deliberately - discovering
  // unknown models is the point of contextual extraction.
  {
    const rFiltered = extractContextualModelRefs(py2, new Set(["Anthropic"]));
    assert(!rFiltered.some(r => r.provider === "OpenAI"), "filter drops non-matching attributed providers");
    assert(rFiltered.some(r => r.provider === null && r.model === "o4-mini"), "unattributed refs survive the filter");
    assert(extractContextualModelRefs(py2, new Set(["OpenAI"])).length === 2, "filter keeps matching providers");
  }
}

section("Fallback manifest parsers (dependenciesDetector)");
{
  const GO = ["github.com/sashabaranov/go-openai", "github.com/anthropics/anthropic-sdk-go", "github.com/tmc/langchaingo"];
  const RUST = ["async-openai", "candle-core"];
  const JAVA = ["dev.langchain4j:langchain4j", "com.openai:openai-java", "com.google.cloud:google-cloud-aiplatform"];

  const goMod = 'module github.com/example/app\n\ngo 1.22\n\nrequire github.com/sashabaranov/go-openai v1.32.5\n\nrequire (\n\tgithub.com/anthropics/anthropic-sdk-go v0.2.0\n\tgithub.com/gin-gonic/gin v0.9.1\n\tgithub.com/tmc/langchaingo v0.1.12\n)\n';
  const gd = findInGoMod(goMod, GO);
  assert(gd.length === 3, `go.mod finds 3 AI deps (got ${gd.length})`);
  assert(gd[0].version === "v1.32.5", "go.mod captures version");
  assert(findInGoMod("require github.com/stretchr/testify v1.9.0", GO).length === 0, "go.mod skips non-AI deps");

  const cargo = '[package]\nname = "app"\n\n[dependencies]\ntokio = { version = "1", features = ["full"] }\nasync-openai = "0.27"\ncandle-core = { version = "0.8" }\n\n[dev-dependencies]\nllm = "0.13"\n';
  const cd = findInCargoToml(cargo, RUST);
  assert(cd.some(d => d.name === "async-openai" && d.version === "0.27"), "Cargo.toml simple version form");
  assert(cd.some(d => d.name === "candle-core" && d.version === "0.8"), "Cargo.toml inline-table version");
  assert(!cd.some(d => d.name === "tokio" || d.name === "llm"), "Cargo.toml skips non-AI + dev-deps");

  const pom = '<project>\n  <dependency>\n    <groupId>dev.langchain4j</groupId>\n    <artifactId>langchain4j-open-ai</artifactId>\n    <version>1.0.0-beta3</version>\n  </dependency>\n  <dependency>\n    <groupId>org.apache.commons</groupId>\n    <artifactId>commons-lang3</artifactId>\n  </dependency>\n</project>';
  const pd = findInPomXml(pom, JAVA);
  assert(pd.length === 1 && pd[0].name === "dev.langchain4j:langchain4j-open-ai" && pd[0].version === "1.0.0-beta3",
    "pom.xml finds langchain4j with version");

  const gradle = 'dependencies {\n    implementation \'com.openai:openai-java:0.1.1\'\n    implementation "com.google.cloud:google-cloud-aiplatform:3.50.0"\n    testImplementation \'junit:junit:4.13\'\n}';
  const grd = findInGradle(gradle, JAVA);
  assert(grd.length === 2 && grd[0].version === "0.1.1", "build.gradle finds AI deps with versions");
}

section("Infrastructure patterns (digest pinning, model env config)");
{
  const digest = INFRASTRUCTURE_PATTERNS.containerization.patterns.find(p => p.platform === "Digest-Pinned Base Image");
  assert(!!digest, "Digest-Pinned Base Image pattern registered");
  assert(digest && digest.pattern.test("FROM ghcr.io/acme/ai-service@sha256:" + "a".repeat(64)), "matches digest-pinned FROM");
  assert(digest && !digest.pattern.test("FROM python:3.11-slim"), "does not match tag-pinned FROM");

  const imgDigest = INFRASTRUCTURE_PATTERNS.orchestration.patterns.find(p => p.platform === "Digest-Pinned Container Image");
  assert(imgDigest && imgDigest.pattern.test("image: us-docker.pkg.dev/org/proj/ai-api@sha256:" + "b".repeat(64)), "matches k8s digest-pinned image");

  const modelEnv = INFRASTRUCTURE_PATTERNS.orchestration.patterns.find(p => p.platform === "AI Model Environment Config");
  assert(modelEnv && modelEnv.pattern.test("          - name: MODEL_DEPLOYMENT\n            value: gpt-4o-mini"), "matches k8s MODEL_* env var name");
  assert(modelEnv && !modelEnv.pattern.test("          - name: APP_LOG_LEVEL\n            value: debug"), "does not match unrelated env vars");
}

section("OWASP LLM Top-10 derivation (extended AIBOM)");
{
  const findings = [
    { category: "dependencies", title: "Dependency: chromadb", description: "LLM-related dependency: chromadb", dependencyInfo: { name: "chromadb" } },
    { category: "code", title: "CrewAI SDK Usage Detected", description: "Found CrewAI SDK usage" },
    { modelInfo: { provider: "OpenAI", modelName: "gpt-4o" }, title: "OpenAI model", description: "OpenAI model" },
    { category: "protocol", title: "MCP Server Config Usage", description: "Model Context Protocol (MCP) server config" }
  ];
  const owasp = assessOWASPLLMTop10(findings);
  assert(owasp.some(r => r.id === "LLM01" && r.status === "exposure-surface-detected"), "LLM01 surface from protocol findings");
  assert(owasp.some(r => r.id === "LLM02"), "LLM02 surface from cloud model usage");
  assert(owasp.some(r => r.id === "LLM03"), "LLM03 surface from dependencies");
  assert(owasp.some(r => r.id === "LLM06"), "LLM06 surface from agent framework");
  assert(owasp.some(r => r.id === "LLM08" && (r.rationale || "").includes("Vector stores")), "LLM08 surface from vector store dep");
  assert(!owasp.some(r => r.id === "LLM04"), "LLM04 not raised without fine-tuning findings");

  const mitigated = assessOWASPLLMTop10([
    { title: "Guardrails SDK Usage Detected", description: "Found Guardrails SDK usage in 1 file(s)" }
  ]);
  assert(mitigated.some(r => r.id === "MITIGATION"), "guardrail detection emits mitigation entry");
}

section("formatModelCardField — structured card fields render as text (models-embedding-001 regression)");
{
  assert(typeof formatModelCardField === "function", "formatModelCardField exposed from utils.js");
  // Real card for Google models/embedding-001: intendedUse/limitations are
  // objects — used to render as "[object Object]" in the findings UI.
  const card = {
    intendedUse: {
      primaryUses: ["Semantic search and retrieval", "Document similarity"],
      outOfScope: ["Text generation"]
    },
    limitations: { knownLimitations: ["Superseded by text-embedding-004", "2048-token input cap"] },
    trainingData: { description: "Trained on diverse text data." }
  };
  const intended = formatModelCardField(card.intendedUse, { primaryUses: "", primaryUseCases: "", outOfScope: "Out of scope" });
  assert(intended === "Semantic search and retrieval; Document similarity. Out of scope: Text generation",
    "intendedUse object -> readable text with out-of-scope label");
  assert(formatModelCardField(card.limitations, { knownLimitations: "" }) === "Superseded by text-embedding-004; 2048-token input cap",
    "limitations.knownLimitations -> '; '-joined text");
  assert(formatModelCardField(card.trainingData, { description: "" }) === "Trained on diverse text data.",
    "trainingData.description passthrough");
  assert(formatModelCardField("plain string") === "plain string", "plain string passthrough");
  assert(formatModelCardField({ note: "legacy" }) === "legacy", "legacy .note string preferred");
  assert(formatModelCardField(null) === "", "null -> empty string");
  assert(formatModelCardField(undefined, {}) === "", "undefined -> empty string");
  assert(formatModelCardField({ noReadables: { x: 1 } }) === "", "object without readable strings -> empty string");
  assert(formatModelCardField(["a", "b"]) === "a; b", "bare string array joined");
}

section("compliance.js — CycloneDX 1.7 / SPDX 3.0.1 / NTIA validators");
{
  const goodCdx = {
    bomFormat: "CycloneDX", specVersion: "1.7", version: 1,
    serialNumber: "urn:uuid:123e4567-e89b-12d3-a456-426614174000",
    metadata: {
      timestamp: "2026-11-21T00:00:00.000Z",
      tools: { components: [{ type: "application", "bom-ref": "tool", name: "AI BOM Generator", version: "1.0.0" }] },
      component: { type: "application", "bom-ref": "repo", name: "repo", purl: "pkg:github/o/r" }
    },
    components: [
      { type: "machine-learning-model", "bom-ref": "m1", name: "m", version: "latest", purl: "pkg:ml/x/m", author: "Prov" },
      { type: "library", "bom-ref": "l1", name: "lib", version: "1.0.0", purl: "pkg:pypi/lib@1.0.0" }
    ],
    dependencies: [{ ref: "repo", dependsOn: ["m1", "l1"] }]
  };
  const goodText = JSON.stringify(goodCdx);
  const rc = validateCycloneDXBom(goodText);
  assert(rc.standard === "CycloneDX 1.7", "CycloneDX report labels the standard");
  assert(rc.checks.every(c => c.status !== "fail"), "well-formed CycloneDX doc: no failed checks");
  assert(validateCycloneDXBom("{ not json").checks[0].status === "fail", "invalid JSON -> fail");
  assert(validateCycloneDXBom("// No findings selected").checks[0].detail.includes("No findings"),
    "placeholder output handled");
  const bad = JSON.parse(goodText);
  bad.serialNumber = "nope"; bad.metadata.timestamp = "nope";
  bad.components[0]["bom-ref"] = "l1"; bad.dependencies[0].dependsOn.push("ghost");
  const rb = validateCycloneDXBom(JSON.stringify(bad));
  assert(["serial", "timestamp", "bom-ref", "dependency-refs"].every(id => rb.checks.find(c => c.id === id).status === "fail"),
    "bad serial/timestamp/dupe-ref/unresolved-dep all detected");

  const rn = checkNtiaMinimumElements(goodText);
  assert(rn.checks.find(c => c.id === "ntia-name").status === "pass", "NTIA: names present -> pass");
  assert(rn.checks.find(c => c.id === "ntia-version").status === "pass", "NTIA: versions present (placeholder noted) -> pass");
  assert(rn.checks.find(c => c.id === "ntia-supplier").status === "warn" &&
         rn.checks.find(c => c.id === "ntia-supplier").detail.includes("1/2"),
    "NTIA: partial supplier attribution -> warn with honest tally");
  assert(rn.checks.find(c => c.id === "ntia-author").status === "warn", "NTIA: tool-only authorship -> honest warn");
  goodCdx.components[1].supplier = { name: "PSF" };
  assert(checkNtiaMinimumElements(JSON.stringify(goodCdx)).checks.find(c => c.id === "ntia-supplier").status === "pass",
    "NTIA: full attribution -> pass");

  const goodSpdx = {
    "@context": "https://spdx.org/rdf/3.0.1/spdx-context.jsonld",
    "@id": "https://x/SpdxDocument", type: "SpdxDocument", spdxId: "https://x/SpdxDocument",
    creationInfo: { type: "CreationInfo", specVersion: "3.0.1", created: "2026-11-21T00:00:00.000Z", createdBy: ["Tool: t-1"] },
    name: "AI BOM",
    element: [
      { "@id": "https://x/Repo", type: "software_Package", spdxId: "https://x/Repo", name: "repo" },
      { "@id": "https://x/Ai", type: "software_Package", spdxId: "https://x/Ai", name: "m" },
      { "@id": "https://x/Rel", type: "Relationship", spdxId: "https://x/Rel", relationshipType: "dependsOn", from: "https://x/Repo", to: ["https://x/Ai"] }
    ],
    rootElement: ["https://x/Repo"]
  };
  const rs = validateSpdxBom(JSON.stringify(goodSpdx));
  assert(rs.checks.every(c => c.status !== "fail"), "well-formed SPDX 3.0.1 doc: no failed checks");
  const badSpdx = JSON.parse(JSON.stringify(goodSpdx));
  badSpdx.creationInfo.specVersion = "3.0.0";
  badSpdx.rootElement = ["https://x/Missing"];
  badSpdx.element[2].to = ["https://x/Ghost"];
  const rsb = validateSpdxBom(JSON.stringify(badSpdx));
  assert(rsb.checks.find(c => c.id === "creation-spec").status === "fail", "wrong specVersion detected");
  assert(rsb.checks.find(c => c.id === "root-elements").status === "fail", "dangling rootElement detected");
  assert(rsb.checks.find(c => c.id === "relationships").status === "fail", "dangling relationship target detected");

  const reports = buildComplianceReports({ "cyclonedx-json": goodText, "spdx": JSON.stringify(goodSpdx) });
  assert(reports.length === 3, "buildComplianceReports -> CycloneDX + NTIA + SPDX");
  assert(buildComplianceReports({}).every(r => r.checks[0].status === "fail"), "empty BOM map -> fail checks");
}

section("compliance.js — AIBOM scorecard matches post-uplift implementation state");
{
  // guidance §6 headline (2026-11-20 snapshot): 65.8/47.4, 45.0/34.0, 50.0/29.2.
  // 2026-11-21 uplift deltas: invented model versions removed → CERT-In #2 and
  // G7 #22 honestly unmet (CERT-In 12/19 = 63.2%); out-of-scope extraction
  // added → CERT-In #16 met (13/19 = 68.4%, strict 10/19 = 52.6%). G7 22/50
  // = 44.0%. OWASP unchanged.
  const expected = { certin: [68.4, 52.6], g7: [44.0, 34.0], owasp: [50.0, 29.2] };
  for (const doc of AIBOM_SCORECARD) {
    const s = computeScorecardStats(doc);
    const [w, st] = expected[doc.id];
    assert(s.weightedPct === w, `${doc.id}: weighted ${s.weightedPct}% === post-uplift ${w}%`);
    assert(s.strictPct === st, `${doc.id}: strict ${s.strictPct}% === documented ${st}%`);
    assert(s.total === doc.rows.length, `${doc.id}: ${s.total} rows scored`);
    assert(s.met + s.partial + s.unmet === s.total, `${doc.id}: every row classified`);
  }
}

section("bom-generators — library identity, purls, evidence (Snyk-comparison uplift)");
{
  assert(typeof resolveLibraryIdentity === "function", "resolveLibraryIdentity exposed");
  // Real chatAssistant finding shape: dependencyInfo carries name/version/ecosystem
  const depFinding = {
    title: "Dependency: langchain",
    description: "LLM-related dependency: langchain (version: 0.1.13)",
    dependencyInfo: { name: "langchain", version: "0.1.13", ecosystem: "python", source: "github-sbom-api" },
    evidence: [{ file: "GitHub Dependency Graph (SBOM)", snippet: "SPDX Package: langchain@0.1.13" }]
  };
  const id1 = resolveLibraryIdentity(depFinding);
  assert(id1.name === "langchain" && id1.version === "0.1.13", "dependencyInfo name/version preferred");
  assert(buildLibraryPurl(id1.name, id1.version, id1.ecosystem) === "pkg:pypi/langchain@0.1.13",
    "versioned pypi purl built");
  // Fallback parse without dependencyInfo
  const id2 = resolveLibraryIdentity({
    title: "Dependency: chromadb",
    description: "LLM-related dependency: chromadb (version: 0.4.24)"
  });
  assert(id2.name === "chromadb" && id2.version === "0.4.24", "title/description fallback parse");
  // Unknown versions stay null (no invented versions)
  const id3 = resolveLibraryIdentity({ title: "Dependency: langchain-community", description: "AI package imported in source but not declared in manifests: langchain-community (version unknown)" });
  assert(id3.version === null, "unknown version -> null (never invented)");
  assert(buildLibraryPurl("langchain-community", null, "python") === "pkg:pypi/langchain-community",
    "unversioned purl");
  assert(buildLibraryPurl("@langchain/community", null, "npm") === "pkg:npm/%40langchain/community",
    "npm scoped name: %40-encoded @, / kept as namespace separator");
  assert(buildLibraryPurl("io.modelcontextprotocol.sdk:mcp", null, "java") === "pkg:maven/io.modelcontextprotocol.sdk/mcp",
    "maven group:artifact layout");
  assert(buildLibraryPurl("github.com/mark3labs/mcp-go", null, "go") === "pkg:golang/github.com/mark3labs/mcp-go",
    "golang module path layout");
  assert(buildLibraryPurl("x", "1", "unknown-eco") === null, "unknown ecosystem -> null purl");

  // Native CycloneDX evidence
  const ev1 = buildNativeEvidence({
    severity: "medium",
    dependencyInfo: { source: "github-sbom-api" },
    evidence: [{ file: "GitHub Dependency Graph (SBOM)", snippet: "SPDX Package: langchain@0.1.13" }]
  });
  assert(ev1.identity[0].methods[0].technique === "manifest-analysis" && ev1.identity[0].methods[0].confidence === 0.9,
    "SBOM-sourced identity -> manifest-analysis 0.9");
  assert(ev1.occurrences === undefined, "evidence without line numbers -> no occurrences");
  const ev2 = buildNativeEvidence({
    severity: "medium",
    dependencyInfo: { source: "source-import-analysis" },
    evidence: [{ file: "app/utils/prepare_vectordb.py", line: 1, snippet: "from langchain_community.document_loaders import ..." }]
  });
  assert(ev2.identity[0].methods[0].technique === "source-code-analysis" && ev2.identity[0].methods[0].confidence === 0.7,
    "import-sourced identity -> source-code-analysis 0.7");
  assert(ev2.occurrences.length === 1 && ev2.occurrences[0].line === 1 &&
         ev2.occurrences[0].additionalContext.includes("langchain_community"),
    "occurrence with line + additionalContext snippet");
  const ev3 = buildNativeEvidence({ severity: "high", evidence: [{ file: "app/utils/chatbot.py", line: 23 }] });
  assert(ev3.identity[0].confidence === 0.9, "high severity model detection -> 0.9");
  const ev4 = buildNativeEvidence({ severity: "low", evidence: [] });
  assert(ev4.identity[0].confidence === 0.5 && ev4.occurrences === undefined, "low severity -> 0.5, no occurrences");

  // structuredCardList: schema arrays from card shapes (embedding-001 shape)
  assert(JSON.stringify(structuredCardList(
    { primaryUses: ["Semantic search and retrieval", "Document similarity"], outOfScope: ["Text generation"] },
    ["primaryUses", "primaryUseCases"])) === JSON.stringify(["Semantic search and retrieval", "Document similarity"]),
    "structuredCardList reads primaryUses array");
  assert(JSON.stringify(structuredCardList(
    { knownLimitations: ["Superseded by text-embedding-004", "2048-token cap"] },
    ["knownLimitations"])) === JSON.stringify(["Superseded by text-embedding-004", "2048-token cap"]),
    "structuredCardList reads knownLimitations array");
  assert(JSON.stringify(structuredCardList("a; b; c", ["x"])) === JSON.stringify(["a", "b", "c"]),
    "structuredCardList splits flat string fallback");
  assert(structuredCardList(null, ["x"]).length === 0, "structuredCardList null -> empty");
}

section("detectors — aiImportsDetector: undeclared-but-imported AI packages");
{
  assert(typeof aiImportsDetector === "function", "aiImportsDetector exposed");
  // chatAssistant scenario: langchain-community/langchain-core imported,
  // absent from requirements.txt and from the SBOM-derived knownDeps set.
  const files = {
    "app/utils/prepare_vectordb.py":
      "from langchain_community.document_loaders import PyPDFLoader\nfrom langchain_google_genai import GoogleGenerativeAIEmbeddings\nimport chromadb\n",
    "app/utils/chatbot.py":
      "from langchain_core.messages import HumanMessage\nllm = ChatGoogleGenerativeAI(model=\"gemini-pro\")\n"
  };
  const existingDeps = {
    findings: [
      { category: "dependencies", title: "Dependency: chromadb", dependencyInfo: { name: "chromadb", version: "0.4.24", ecosystem: "python", source: "github-sbom-api" } },
      { category: "dependencies", title: "Dependency: langchain-google-genai", dependencyInfo: { name: "langchain-google-genai", version: "0.0.11", ecosystem: "python", source: "github-sbom-api" } }
    ]
  };
  window.__importsPromise = aiImportsDetector({
    aiFilesFound: Object.keys(files),
    getFileContent: (f) => files[f],
    allFindings: existingDeps.findings
  }).then((result) => {
    const found = result.findings.map((f) => f.dependencyInfo.name);
    assert(found.includes("langchain-community"), "langchain-community import detected (undeclared)");
    assert(found.includes("langchain-core"), "langchain-core import detected (undeclared)");
    assert(!found.includes("chromadb"), "declared chromadb not duplicated");
    assert(!found.includes("langchain-google-genai"), "declared langchain-google-genai not duplicated");
    const f0 = result.findings[0];
    assert(f0.dependencyInfo.source === "source-import-analysis", "import findings tagged source-import-analysis");
    assert(f0.dependencyInfo.version === "unknown", "import findings carry no invented version");
    assert(f0.evidence[0].line === 1 && f0.evidence[0].file === "app/utils/prepare_vectordb.py",
      "evidence carries file + line");
    renderResults();
  }).catch((err) => {
    assert(false, "aiImportsDetector threw: " + err.message);
    renderResults();
  });
}
