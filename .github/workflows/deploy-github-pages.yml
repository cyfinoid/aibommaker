name: Deploy to GitHub Pages

# Trigger on release creation for better control
on:
  release:
    types: [published]
  
  # Allow manual trigger from Actions tab for testing
  workflow_dispatch:

# Minimal permissions following principle of least privilege
permissions:
  contents: read      # Read repository contents
  pages: write        # Deploy to GitHub Pages
  id-token: write     # Verify deployment origin (OIDC)

# Ensure only one deployment runs at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1  # Only need current state, not history
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Create deployment directory
        run: |
          mkdir -p _site
          
          echo "📦 Copying AI BOM Generator files..."
          
          # Copy main HTML file
          cp index.html _site/
          echo "✅ Copied index.html"
          
          # Copy CSS
          cp styles.css _site/
          echo "✅ Copied styles.css"
          
          # Copy JavaScript modules (js/ folder)
          cp -r js _site/
          echo "✅ Copied js/ directory"
          
          # Copy library files (syntax highlighting)
          cp -r lib _site/
          echo "✅ Copied lib/ directory"

          # Copy model cards database
          cp -r modelcards _site/
          echo "✅ Copied modelcards/ directory"

          # Add .nojekyll to prevent Jekyll processing
          touch _site/.nojekyll
          echo "✅ Created .nojekyll file"
          
          echo ""
          echo "📊 Deployment summary:"
          echo "  - HTML files: $(ls -1 _site/*.html 2>/dev/null | wc -l)"
          echo "  - CSS files: $(ls -1 _site/*.css 2>/dev/null | wc -l)"
          echo "  - JS modules: $(find _site/js -name '*.js' 2>/dev/null | wc -l)"
          echo "  - Library files: $(find _site/lib -name '*.js' 2>/dev/null | wc -l)"
          echo "  - Model cards: $(find _site/modelcards -name '*.json' 2>/dev/null | wc -l)"
          echo ""
          echo "📁 Contents of _site/:"
          ls -la _site/
          echo ""
          echo "📁 Contents of _site/js/:"
          ls -la _site/js/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Successfully deployed AI BOM Generator to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "📦 Release: ${{ github.event.release.tag_name || 'manual trigger' }}" >> $GITHUB_STEP_SUMMARY
          echo "🔗 URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- index.html (main application)" >> $GITHUB_STEP_SUMMARY
          echo "- styles.css (Cyfinoid branding)" >> $GITHUB_STEP_SUMMARY
          echo "- js/ (8 modular JavaScript files)" >> $GITHUB_STEP_SUMMARY
          echo "  - constants.js (detection patterns)" >> $GITHUB_STEP_SUMMARY
          echo "  - utils.js (helper functions)" >> $GITHUB_STEP_SUMMARY
          echo "  - github-api.js (API integration)" >> $GITHUB_STEP_SUMMARY
          echo "  - detectors.js (AI detection logic)" >> $GITHUB_STEP_SUMMARY
          echo "  - analyzer.js (orchestration)" >> $GITHUB_STEP_SUMMARY
          echo "  - bom-generators.js (CycloneDX/SPDX)" >> $GITHUB_STEP_SUMMARY
          echo "  - extended-aibom-generator.js (Extended AIBOM format)" >> $GITHUB_STEP_SUMMARY
          echo "  - ui.js (UI rendering)" >> $GITHUB_STEP_SUMMARY
          echo "- lib/ (syntax highlighting)" >> $GITHUB_STEP_SUMMARY
          echo "- modelcards/ (100+ model cards database)" >> $GITHUB_STEP_SUMMARY

